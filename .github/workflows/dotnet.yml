# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Pre-release
      shell: pwsh
      run: .\scripts\Run-PreRelease.ps1 -Configuration Debug -OutputDirectory ".\artifacts\pre-release"
    - name: Upload pre-release artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pre-release-summary
        path: |
          artifacts/pre-release/pre-release-summary.txt
          artifacts/pre-release/pre-release.log
          artifacts/pre-release/validation-summary.txt
          artifacts/pre-release/validation-report.json
        if-no-files-found: error
